name: sandeul-factory-tunnel

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.7.3
    container_name: factory-tunnel
    command: ["tunnel", "--config", "/etc/cloudflared/config.yaml", "--no-autoupdate", "run"]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ./config.yaml.example
        target: /etc/cloudflared/config.yaml
        read_only: true
      - type: bind
        source: ${FACTORY_CLOUDFLARED_CREDENTIALS_FILE:?Set FACTORY_CLOUDFLARED_CREDENTIALS_FILE}
        target: /etc/cloudflared/credentials/0bcebddc-8c98-4921-ae4e-50f681bdfb2b.json
        read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
