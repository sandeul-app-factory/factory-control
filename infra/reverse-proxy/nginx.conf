worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  client_max_body_size 50m;
  proxy_connect_timeout 10s;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  upstream factory_web {
    server web:3000;
  }

  upstream factory_api {
    server api:4000;
  }

  server {
    listen 8080;

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location /api/ {
      proxy_pass http://factory_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-Id $http_x_request_id;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      add_header X-Content-Type-Options nosniff always;
    }

    # The bucket remains private. MinIO validates the short-lived query signature,
    # exact host, and full path before returning an object.
    location /factory-artifacts/ {
      proxy_pass http://minio:9000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      add_header X-Content-Type-Options nosniff always;
    }

    location / {
      proxy_pass http://factory_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      add_header X-Content-Type-Options nosniff always;
    }
  }
}
