name: sandeul-factory-dev

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-factory}
      POSTGRES_USER: ${POSTGRES_USER:-factory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_BIND_PORT:-5432}:5432"
    volumes:
      - factory_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-factory} -d ${POSTGRES_DB:-factory}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_BIND_PORT:-6379}:6379"
    volumes:
      - factory_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - factory_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        mc alias set factory http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
        mc mb --ignore-existing "factory/${S3_BUCKET:-factory-artifacts}";
        mc anonymous set none "factory/${S3_BUCKET:-factory-artifacts}"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}

  migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        FILTER: "@sandeul/database"
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-factory}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-factory}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        FILTER: "@sandeul/api"
    environment:
      NODE_ENV: development
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-factory}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-factory}?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECURE: "false"
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-factory_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:3000}
      AUDIT_HASH_PEPPER: ${AUDIT_HASH_PEPPER:?AUDIT_HASH_PEPPER is required}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-factory-artifacts}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      MAX_JSON_BODY_BYTES: ${MAX_JSON_BODY_BYTES:-3145728}
      GITHUB_ADAPTER: ${GITHUB_ADAPTER:-fake}
      CODEX_ADAPTER: ${CODEX_ADAPTER:-fake}
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_WRITE_ENABLED: ${MCP_WRITE_ENABLED:-false}
      MCP_TOKEN_PEPPER: ${MCP_TOKEN_PEPPER:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-http://localhost:3000}
      MCP_MAX_PRD_BYTES: ${MCP_MAX_PRD_BYTES:-2097152}
    ports:
      - "127.0.0.1:${API_BIND_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/api/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        FILTER: "@sandeul/web"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
      API_INTERNAL_URL: http://api:4000
    ports:
      - "127.0.0.1:${WEB_BIND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker-workspace-init:
    profiles: ["fake-worker"]
    image: sandeul-factory-dev-worker:latest
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R node:node /var/lib/factory-workspaces"]
    volumes:
      - factory_workspaces:/var/lib/factory-workspaces
    restart: "no"

  worker:
    profiles: ["fake-worker"]
    image: sandeul-factory-dev-worker:latest
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      args:
        FILTER: "@sandeul/worker"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-factory}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-factory}?schema=public
      REDIS_URL: redis://redis:6379
      CODEX_ADAPTER: fake
      CODEX_QUEUE_NAME: ${CODEX_QUEUE_NAME:-codex-tasks}
      CODEX_CONCURRENCY: ${CODEX_CONCURRENCY:-1}
      CODEX_JOB_TIMEOUT_MS: ${CODEX_JOB_TIMEOUT_MS:-1800000}
      CODEX_JOB_MAX_ATTEMPTS: ${CODEX_JOB_MAX_ATTEMPTS:-3}
      CODEX_WORKSPACE_ROOT: /var/lib/factory-workspaces
      CODEX_WORKSPACE_CLEANUP: ${CODEX_WORKSPACE_CLEANUP:-true}
      CODEX_RESULT_SCHEMA_PATH: /app/schemas/codex/codex-result.schema.json
      CODEX_ALLOWED_TEST_COMMANDS: ${CODEX_ALLOWED_TEST_COMMANDS:-pnpm test,pnpm lint,pnpm typecheck,./gradlew test,./gradlew lint}
      GITHUB_ADAPTER: ${GITHUB_ADAPTER:-fake}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_INSTALLATION_ID: ${GITHUB_INSTALLATION_ID:-}
      GITHUB_PRIVATE_KEY_BASE64: ${GITHUB_PRIVATE_KEY_BASE64:-}
      GITHUB_FINE_GRAINED_PAT: ${GITHUB_FINE_GRAINED_PAT:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-factory-artifacts}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: "true"
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-536870912}
      MAX_BUILD_ARTIFACT_BYTES: ${MAX_BUILD_ARTIFACT_BYTES:-536870912}
    volumes:
      - factory_workspaces:/var/lib/factory-workspaces
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      worker-workspace-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  factory_postgres:
  factory_redis:
  factory_minio:
  factory_workspaces:
